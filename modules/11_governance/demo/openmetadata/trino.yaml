# Сбор метаданных: Trino, каталог iceberg → сервис trino_lake в OpenMetadata.
# Запуск: make om-ingest CFG=modules/11_governance/demo/openmetadata/trino.yaml
source:
  type: trino
  serviceName: trino_lake
  serviceConnection:
    config:
      type: Trino
      hostPort: trino:8080
      username: openmetadata
      catalog: iceberg
  sourceConfig:
    config:
      type: DatabaseMetadata
      schemaFilterPattern:
        includes: ["governance_demo", "serving_demo"]
      markDeletedTables: true
sink:
  type: metadata-rest
  config: {}
workflowConfig:
  loggerLevel: INFO
  openMetadataServerConfig:
    hostPort: http://openmetadata:8585/api
    authProvider: openmetadata
    securityConfig:
      jwtToken: ${OM_INGESTION_TOKEN}
