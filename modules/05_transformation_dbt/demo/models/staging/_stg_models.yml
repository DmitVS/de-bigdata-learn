models:
  - name: stg_weather
    description: "Погода магазина за день: одна строка на магазин и дату"
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [store_id, weather_date]
    columns:
      - name: store_id
        description: "Магазин (ID датасета)"
        data_tests: [not_null]
      - name: city_id
        description: "Город магазина (ID датасета)"
      - name: weather_date
        description: "Дата наблюдения"
      - name: precipitation
        description: "{{ doc('precipitation') }}"
        data_tests: [non_negative]
