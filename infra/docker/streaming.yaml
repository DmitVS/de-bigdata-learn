# Слой streaming (модуль 08): брокер событий, CDC и потоковая обработка.
#   redpanda          — Kafka-совместимый брокер (Kafka API redpanda:9092) со встроенным Schema
#                       Registry (http://redpanda:8081) и HTTP-прокси
#   redpanda-console  — UI топиков, групп, схем и коннекторов: http://localhost:8084
#   connect           — Kafka Connect с коннекторами Debezium (REST http://connect:8083):
#                       CDC из Postgres retail_oltp через логическую репликацию
#   flink-jobmanager  — координатор Flink, UI: http://localhost:8086
#   flink-taskmanager — исполнитель Flink (4 слота)
#
# Запуск: make up PROFILES="streaming". Flink SQL: make flink-sql.
# Для CDC Postgres работает с wal_level=logical (core.yaml).

x-flink: &flink
  build:
    context: ./flink
  image: debd/flink:2.1.3
  profiles: [streaming]
  volumes:
    - ../..:/workspace
    - flink-checkpoints:/opt/flink/checkpoints
  restart: unless-stopped

services:
  redpanda:
    image: redpandadata/redpanda:v26.2.3
    profiles: [streaming]
    command:
      - redpanda
      - start
      - --mode=dev-container # один узел, без требований к продакшен-настройкам ОС
      - --smp=1
      - --memory=1G
      - --kafka-addr=internal://0.0.0.0:9092
      - --advertise-kafka-addr=internal://redpanda:9092
      - --schema-registry-addr=0.0.0.0:8081
      - --pandaproxy-addr=0.0.0.0:8082
      - --advertise-pandaproxy-addr=redpanda:8082
    volumes:
      - redpanda-data:/var/lib/redpanda/data
    healthcheck:
      test: ["CMD-SHELL", "rpk cluster health | grep -q 'Healthy:.*true'"]
      interval: 5s
      timeout: 5s
      retries: 30
    restart: unless-stopped

  redpanda-console:
    image: redpandadata/console:v3.12.0
    profiles: [streaming]
    environment:
      CONFIG_FILEPATH: /etc/console/config.yaml
    volumes:
      - ./redpanda/console.yaml:/etc/console/config.yaml:ro
    ports:
      - "127.0.0.1:8084:8080"
    depends_on:
      redpanda:
        condition: service_healthy
    restart: unless-stopped

  connect:
    image: quay.io/debezium/connect:3.7.0.Final
    profiles: [streaming]
    environment:
      BOOTSTRAP_SERVERS: redpanda:9092
      GROUP_ID: debd-connect
      CONFIG_STORAGE_TOPIC: _connect_configs
      OFFSET_STORAGE_TOPIC: _connect_offsets
      STATUS_STORAGE_TOPIC: _connect_status
      # Один брокер: служебные топики Connect с одной репликой
      CONFIG_STORAGE_REPLICATION_FACTOR: 1
      OFFSET_STORAGE_REPLICATION_FACTOR: 1
      STATUS_STORAGE_REPLICATION_FACTOR: 1
      HEAP_OPTS: -Xms256m -Xmx768m
      # Секреты коннекторов — из окружения: в JSON коннектора пишут ${env:POSTGRES_PASSWORD},
      # а не сам пароль (EnvVarConfigProvider Kafka Connect)
      CONNECT_CONFIG_PROVIDERS: env
      CONNECT_CONFIG_PROVIDERS_ENV_CLASS: org.apache.kafka.common.config.provider.EnvVarConfigProvider
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8083/connectors"]
      interval: 5s
      timeout: 5s
      retries: 40
      start_period: 20s
    depends_on:
      redpanda:
        condition: service_healthy
      postgres:
        condition: service_healthy
    restart: unless-stopped

  flink-jobmanager:
    <<: *flink
    command: jobmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        jobmanager.memory.process.size: 1024m
        execution.checkpointing.interval: 10s
        state.checkpoints.dir: file:///opt/flink/checkpoints
    ports:
      - "127.0.0.1:8086:8081" # UI Flink (8081 на хосте занят Airflow)
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8081/overview"]
      interval: 5s
      timeout: 5s
      retries: 30
    depends_on:
      lakekeeper-init:
        condition: service_completed_successfully

  flink-taskmanager:
    <<: *flink
    command: taskmanager
    environment:
      FLINK_PROPERTIES: |
        jobmanager.rpc.address: flink-jobmanager
        taskmanager.numberOfTaskSlots: 4
        taskmanager.memory.process.size: 2048m
        execution.checkpointing.interval: 10s
        state.checkpoints.dir: file:///opt/flink/checkpoints
    depends_on:
      flink-jobmanager:
        condition: service_healthy

volumes:
  redpanda-data:
  flink-checkpoints:
