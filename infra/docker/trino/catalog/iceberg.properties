# Каталог iceberg: таблицы lakehouse через REST-каталог Lakekeeper.
# Ключи S3 Trino получает от каталога (vended credentials), поэтому их здесь нет.
connector.name=iceberg
iceberg.catalog.type=rest
iceberg.rest-catalog.uri=http://lakekeeper:8181/catalog
iceberg.rest-catalog.warehouse=${ENV:ICEBERG_WAREHOUSE}
iceberg.rest-catalog.vended-credentials-enabled=true
fs.native-s3.enabled=true
s3.endpoint=http://silo:9000
s3.region=local-01
s3.path-style-access=true
