# Настройки Spark для всех сервисов слоя spark.yaml (модуль 07).
# Монтируется в /opt/spark/conf/spark-defaults.conf.

# Iceberg: каталог lh — REST-каталог Lakekeeper (warehouse lakehouse). Ключи S3 не нужны:
# каталог выдаёт временные (vended credentials), адрес Silo и path-style — из профиля warehouse.
spark.sql.extensions                                org.apache.iceberg.spark.extensions.IcebergSparkSessionExtensions
spark.sql.catalog.lh                                org.apache.iceberg.spark.SparkCatalog
spark.sql.catalog.lh.type                           rest
spark.sql.catalog.lh.uri                            http://lakekeeper:8181/catalog
spark.sql.catalog.lh.warehouse                      lakehouse
spark.sql.catalog.lh.header.X-Iceberg-Access-Delegation vended-credentials
spark.sql.catalog.lh.io-impl                        org.apache.iceberg.aws.s3.S3FileIO

# Ресурсы приложения (сервер Spark Connect = одно долгоживущее приложение): по executor на
# каждом worker, 2 ядра и 2 ГБ памяти на executor.
spark.executor.cores                                2
spark.executor.memory                               2g
spark.cores.max                                     4

# Партиций после shuffle по умолчанию 200 — много для учебных объёмов; AQE их объединяет
# (урок 02). Значение оставлено по умолчанию намеренно.
spark.sql.adaptive.enabled                          true

# UI: хранить больше завершённых заданий — разбор в лабе 07.3 идёт после запуска.
spark.ui.retainedJobs                               500
spark.sql.ui.retainedExecutions                     500
