# Слой spark (модуль 07): кластер Spark standalone + сервер Spark Connect.
#   spark-master    — менеджер кластера: учёт workers и раздача ресурсов приложениям
#                     (UI http://localhost:8090)
#   spark-worker-1/2 — по 2 ядра и 3 ГБ на каждом; на них запускаются executors
#   spark-connect   — driver долгоживущего приложения Spark Connect: принимает планы от клиентов
#                     по gRPC (sc://spark-connect:15002), UI приложения — http://localhost:4040
#
# Клиент — workspace (pyspark-client, без JVM):
#   SparkSession.builder.remote("sc://spark-connect:15002").getOrCreate()
# Запуск: make up PROFILES="spark". Образ — spark/Dockerfile, настройки — spark/spark-defaults.conf.

x-spark: &spark
  build:
    context: ./spark
    args:
      UID: ${HOST_UID:-1000} # пользователь dev в образе = владелец репозитория на хосте
      GID: ${HOST_GID:-1000}
  image: debd/spark:4.1.3
  profiles: [spark]
  volumes:
    - ../..:/workspace
    - ./spark/spark-defaults.conf:/opt/spark/conf/spark-defaults.conf:ro
  working_dir: /workspace
  restart: unless-stopped

services:
  spark-master:
    <<: *spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.master.Master",
              "--host", "spark-master", "--port", "7077", "--webui-port", "8080"]
    ports:
      - "127.0.0.1:8090:8080" # UI менеджера кластера
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8080"]
      interval: 5s
      timeout: 5s
      retries: 20

  spark-worker-1:
    <<: *spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077", "--cores", "2", "--memory", "3g"]
    depends_on:
      spark-master:
        condition: service_healthy

  spark-worker-2:
    <<: *spark
    command: ["/opt/spark/bin/spark-class", "org.apache.spark.deploy.worker.Worker",
              "spark://spark-master:7077", "--cores", "2", "--memory", "3g"]
    depends_on:
      spark-master:
        condition: service_healthy

  spark-connect:
    <<: *spark
    command: ["/opt/spark/sbin/start-connect-server.sh", "--master", "spark://spark-master:7077",
              "--conf", "spark.driver.memory=2g", "--conf", "spark.driver.host=spark-connect"]
    ports:
      - "127.0.0.1:4040:4040" # UI приложения: jobs, stages, SQL-планы
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:4040"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 15s
    depends_on:
      spark-worker-1:
        condition: service_started
      spark-worker-2:
        condition: service_started
      lakekeeper-init:
        condition: service_completed_successfully
