# Слой core — работает всегда (модули 00–05).
#   postgres   — метаданные Lakekeeper + учебная OLTP-база retail_oltp (источник для CDC в модуле 08)
#   silo       — S3-совместимое объектное хранилище (поддерживаемый форк MinIO)
#   lakekeeper — Iceberg REST-каталог
#   workspace  — рабочий контейнер с Python-инструментами (dbt, dlt, DuckDB, Polars, PyIceberg, Jupyter)
#
# Все порты опубликованы только на 127.0.0.1. Секреты — из .env (шаблон .env.example).

x-lakekeeper-env: &lakekeeper-env
  LAKEKEEPER__PG_ENCRYPTION_KEY: ${LAKEKEEPER_ENCRYPTION_KEY}
  LAKEKEEPER__PG_DATABASE_URL_READ: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/lakekeeper
  LAKEKEEPER__PG_DATABASE_URL_WRITE: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/lakekeeper
  RUST_LOG: info

services:
  postgres:
    image: postgres:17.11
    # wal_level=logical — журнал хранит построчные изменения для логической репликации:
    # на нём работает CDC через Debezium (модуль 08). Применяется при перезапуске контейнера.
    command: ["postgres", "-c", "wal_level=logical"]
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./postgres/init:/docker-entrypoint-initdb.d:ro
    ports:
      - "127.0.0.1:5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  silo:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes:
      - silo-data:/data
    ports:
      - "127.0.0.1:9000:9000" # S3 API
      - "127.0.0.1:9001:9001" # веб-консоль
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # Однократно: бакеты landing (сырые файлы), warehouse (данные Iceberg), tfstate (состояние
  # Terraform, модуль 12).
  silo-init:
    image: pgsty/silo:RELEASE.2026-09-03T13-18-01Z
    depends_on:
      silo:
        condition: service_healthy
    entrypoint: /bin/sh
    command:
      - -c
      - |
        mc alias set local http://silo:9000 "$${S3_ACCESS_KEY}" "$${S3_SECRET_KEY}" &&
        mc mb --ignore-existing local/landing local/warehouse local/tfstate
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
    restart: "no"

  lakekeeper-migrate:
    image: quay.io/lakekeeper/catalog:v0.13.6
    command: ["migrate"]
    environment: *lakekeeper-env
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  lakekeeper:
    image: quay.io/lakekeeper/catalog:v0.13.6
    command: ["serve"]
    environment: *lakekeeper-env
    ports:
      - "127.0.0.1:8181:8181" # REST API и UI (http://localhost:8181/ui)
    healthcheck:
      test: ["CMD", "/home/nonroot/lakekeeper", "healthcheck"]
      interval: 5s
      timeout: 10s
      retries: 10
      start_period: 5s
    depends_on:
      lakekeeper-migrate:
        condition: service_completed_successfully
      silo-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # Однократно: bootstrap каталога и создание warehouse "lakehouse" в бакете warehouse.
  lakekeeper-init:
    image: curlimages/curl:8.22.0
    entrypoint: /bin/sh
    command: ["/init/init.sh"]
    environment:
      S3_ACCESS_KEY: ${S3_ACCESS_KEY}
      S3_SECRET_KEY: ${S3_SECRET_KEY}
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
    volumes:
      - ./lakekeeper:/init:ro
    depends_on:
      lakekeeper:
        condition: service_healthy
    restart: "no"

  workspace:
    build:
      context: ../..
      dockerfile: infra/docker/workspace/Dockerfile
      args:
        UID: ${HOST_UID:-1000}
        GID: ${HOST_GID:-1000}
    image: debd/workspace:local
    working_dir: /workspace
    volumes:
      - ../..:/workspace
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      S3_ENDPOINT: http://silo:9000
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_REGION: local-01
      ICEBERG_CATALOG_URI: http://lakekeeper:8181/catalog
      ICEBERG_WAREHOUSE: ${ICEBERG_WAREHOUSE}
      HF_HOME: /workspace/data/.hf_cache
      # dlt (модуль 04): секреты и адреса — из окружения, не из файлов в git.
      # Рабочие папки пайплайнов — в data/.dlt, чтобы состояние пережило пересоздание контейнера.
      DLT_DATA_DIR: /workspace/data/.dlt
      DESTINATION__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      DESTINATION__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      DESTINATION__FILESYSTEM__CREDENTIALS__ENDPOINT_URL: http://silo:9000
      DESTINATION__FILESYSTEM__CREDENTIALS__REGION_NAME: local-01
      SOURCES__FILESYSTEM__CREDENTIALS__AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      SOURCES__FILESYSTEM__CREDENTIALS__AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      SOURCES__FILESYSTEM__CREDENTIALS__ENDPOINT_URL: http://silo:9000
      SOURCES__FILESYSTEM__CREDENTIALS__REGION_NAME: local-01
      SOURCES__SQL_DATABASE__CREDENTIALS: postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/retail_oltp
      SOURCES__RETAIL_API__API_KEY: ${RETAIL_API_KEY}
      RETAIL_API_URL: http://retail-api:8000
      SUPERSET_ADMIN_PASSWORD: ${SUPERSET_ADMIN_PASSWORD:-} # модули 10–11: скрипты API Superset
      # Модуль 13 (опционально): реквизиты Snowflake для dbt-snowflake; пусто — работает только dbt parse
      SNOWFLAKE_ACCOUNT: ${SNOWFLAKE_ACCOUNT:-}
      SNOWFLAKE_USER: ${SNOWFLAKE_USER:-}
      SNOWFLAKE_PASSWORD: ${SNOWFLAKE_PASSWORD:-}
      SNOWFLAKE_ROLE: ${SNOWFLAKE_ROLE:-SYSADMIN}
      ICEBERG_CATALOG__ICEBERG_CATALOG_TYPE: rest
      ICEBERG_CATALOG__ICEBERG_CATALOG_CONFIG: >-
        {"type": "rest", "uri": "http://lakekeeper:8181/catalog", "warehouse": "${ICEBERG_WAREHOUSE}"}
    ports:
      - "127.0.0.1:8888:8888" # JupyterLab
      - "127.0.0.1:8580:8580" # dbt docs serve / SQLMesh UI (модуль 05), запускаются вручную
    command: >
      jupyter lab --ip=0.0.0.0 --port=8888 --no-browser
      --IdentityProvider.token='' --ServerApp.root_dir=/workspace
    depends_on:
      lakekeeper-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  postgres-data:
  silo-data:

# Явная подсеть: на хосте работает VPN (tun2) с маршрутами 0.0.0.0/1 и 128.0.0.0/1,
# поэтому Docker не может сам выбрать свободный пул адресов. Эту сеть используют все слои.
networks:
  default:
    ipam:
      config:
        - subnet: 172.28.0.0/24
