# Redpanda Console (модуль 08): брокер, Schema Registry и Kafka Connect.
kafka:
  brokers: ["redpanda:9092"]
schemaRegistry:
  enabled: true
  urls: ["http://redpanda:8081"]
redpanda:
  adminApi:
    enabled: true
    urls: ["http://redpanda:9644"]
kafkaConnect:
  enabled: true
  clusters:
    - name: debd-connect
      url: http://connect:8083
