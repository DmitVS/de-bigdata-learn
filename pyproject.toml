[project]
name = "de-bigdata-learn"
version = "0.1.0"
description = "Самообучение Data Engineering на Modern Data Stack (датасет FreshRetailNet-50K)"
requires-python = ">=3.12,<3.13"
# Зависимости ставятся только внутри контейнера workspace (infra/docker/workspace/Dockerfile).
# Инструменты следующих модулей добавляются группами по мере прохождения курса:
#   make uv ARGS="add --group <модуль> <пакет>" && make build
dependencies = [
    "duckdb>=1.5",
    "polars>=1.44",
    "pyarrow>=25.0",
    "pyiceberg[pyarrow,s3fs,sql-postgres,pyiceberg-core]>=0.12",
    "dlt[duckdb,filesystem,postgres]>=1.30",
    "dbt-core>=1.11",
    "dbt-duckdb>=1.11",
    "psycopg[binary]>=3.3",
    "huggingface-hub>=1.32",
    "jupyterlab>=4.6",
]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "shandy-sqlfmt>=0.32",
    "pytest>=9.1",
    "yamllint>=1.37",
]
ingestion = [
    "pandas>=3.0.6",
]
transform = [
    "sqlmesh>=0.228.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.format]
# Фрагменты кода в уроках (*.md) намеренно сжаты для чтения — их не переформатируем
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.sqlfmt]
line_length = 100
exclude = ["**/target/**", "**/dbt_packages/**", "**/demo_sqlmesh/**"]  # sqlfmt не знает блок MODEL SQLMesh
