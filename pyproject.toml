[project]
name = "de-bigdata-learn"
version = "0.1.0"
description = "Самообучение Data Engineering на Modern Data Stack (датасет FreshRetailNet-50K)"
requires-python = ">=3.12,<3.13"
# Зависимости ставятся только внутри контейнера workspace (infra/docker/workspace/Dockerfile).
# Инструменты следующих модулей добавляются группами по мере прохождения курса:
#   make uv ARGS="add --group <модуль> <пакет>" && make build
dependencies = [
    "duckdb>=1.5",
    "polars>=1.44",
    "pyarrow>=25.0",
    "pyiceberg[pyarrow,s3fs,sql-postgres,pyiceberg-core]>=0.12",
    "dlt[duckdb,filesystem,postgres]>=1.30",
    "dbt-core>=1.11",
    "dbt-duckdb>=1.11",
    "psycopg[binary]>=3.3",
    "huggingface-hub>=1.32",
    "jupyterlab>=4.6",
]

[dependency-groups]
dev = [
    "ruff>=0.16",
    "shandy-sqlfmt>=0.32",
    "pytest>=9.1",
    "yamllint>=1.37",
]
ingestion = [
    "pandas>=3.0.6",
]
orchestration = [
    "dagster>=1.13.25",
    "dagster-dbt>=0.29.25",
    "dagster-dlt>=0.29.25",
    "dagster-postgres>=0.29.25",
    "dagster-webserver>=1.13.25",
]
quality = [
    "elementary-data[duckdb]>=0.26.0",
    "soda-core>=4.25.0",
    "soda-duckdb>=4.25.0",
]
spark = [
    "chispa>=0.12",
    "pyspark-client>=4.1.3,<4.2",
]
streaming = [
    "confluent-kafka[avro,schemaregistry]>=2.15.1",
]
transform = [
    "sqlmesh>=0.228.4",
]

[tool.uv]
package = false

[tool.ruff]
line-length = 100
target-version = "py312"
# В контейнере нет .git, поэтому .gitignore не работает: скачанные пакеты dbt и данные исключаем явно
extend-exclude = ["**/dbt_packages/**", "data/**"]

[tool.ruff.format]
# Фрагменты кода в уроках (*.md) намеренно сжаты для чтения — их не переформатируем
exclude = ["*.md"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
# Тесты курса — в модулях и capstone; служебные папки не обходим (тесты чужих пакетов, данные)
norecursedirs = [".*", "data", "dbt_packages", "target", "logs", "node_modules"]

[tool.sqlfmt]
line_length = 100
# demo_sqlmesh — sqlfmt не знает блок MODEL SQLMesh; flink — DDL Flink SQL (WATERMARK, WITH);
# data/.dlt — служебные SQL-файлы dlt (вне git)
exclude = [
    "**/target/**", "**/dbt_packages/**", "**/demo_sqlmesh/**", "**/flink/**", "**/data/**",
    "**/.dlt/**",
]
